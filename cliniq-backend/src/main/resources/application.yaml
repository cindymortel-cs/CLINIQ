ktor:
  deployment:
    port: 8080
    host: 0.0.0.0
  application:
    modules:
      - com.cliniq.HttpKt.configureHttp
      - com.cliniq.SerializationKt.configureSerialization
      - com.cliniq.StatusPagesKt.configureStatusPages
      - com.cliniq.WebsocketsKt.configureWebsockets
      - com.cliniq.RoutingKt.configureRouting

jwt:
  secret: "$JWT_SECRET:cliniq-local-wifi-secret-key-2026"
  issuer: "http://0.0.0.0:8080"
  audience: "cliniq-users"
  realm: "CLINIQ Clinic System"